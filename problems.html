
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VillageConnect - Problems</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #176b45;
            color: white;
            padding: 25px;
        }

        nav {
            background: #125637;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .statistics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .count {
            font-size: 32px;
            font-weight: bold;
            color: #176b45;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        button {
            background: #176b45;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #125637;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .problem {
            border: 1px solid #ddd;
            padding: 18px;
            margin: 15px 0;
            border-radius: 8px;
            background: #fff;
        }

        .problem h3 {
            color: #176b45;
            margin-bottom: 10px;
        }

        .problem p {
            margin: 8px 0;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .Pending {
            background: #fff3cd;
            color: #856404;
        }

        .InProgress {
            background: #cce5ff;
            color: #004085;
        }

        .Resolved {
            background: #d4edda;
            color: #155724;
        }

        .message {
            margin: 15px 0;
            font-weight: bold;
        }

        .empty {
            color: #777;
            padding: 15px 0;
        }

        @media (max-width: 700px) {
            .statistics {
                grid-template-columns: repeat(2, 1fr);
            }

            nav a {
                display: inline-block;
                margin: 5px 12px 5px 0;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>VillageConnect</h1>
    <p>Village Problem Management</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="attendance.html">Attendance</a>
    <a href="problems.html">Problems</a>
</nav>

<div class="container">

    <h2>Village Problems</h2>

    <p>
        Report problems in your village and track their resolution.
    </p>

    <!-- Problem Statistics -->

    <div class="card">
        <h2>Problem Statistics</h2>

        <div class="statistics">

            <div class="stat-card">
                <p>Total Problems</p>
                <div class="count" id="totalCount">0</div>
            </div>

            <div class="stat-card">
                <p>Pending</p>
                <div class="count" id="pendingCount">0</div>
            </div>

            <div class="stat-card">
                <p>In Progress</p>
                <div class="count" id="progressCount">0</div>
            </div>

            <div class="stat-card">
                <p>Resolved</p>
                <div class="count" id="resolvedCount">0</div>
            </div>

        </div>
    </div>

    <!-- Report Problem Form -->

    <div class="card">

        <h2>Report a Problem</h2>

        <form id="problemForm">

            <label>Reporter Name</label>
            <input type="text" id="reporterName"
                   placeholder="Enter your full name"
                   required maxlength="100">

            <label>Contact Number</label>
            <input type="tel" id="reporterContact"
                   placeholder="10-digit mobile number"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10" required>

            <label>Problem Category</label>
            <select id="problemCategory" required>
                <option value="">Select Category</option>
                <option>Water Supply</option>
                <option>Road Damage</option>
                <option>Garbage Collection</option>
                <option>Streetlight</option>
                <option>Drainage</option>
                <option>Electricity</option>
                <option>Other</option>
            </select>

            <label>Problem Description</label>
            <textarea id="problemDescription"
                      rows="4"
                      placeholder="Describe your problem"
                      maxlength="2000"
                      required></textarea>

            <label>Problem Location</label>
            <input type="text" id="problemLocation"
                   placeholder="Ward number, street, landmark"
                   maxlength="250" required>

            <button type="submit" id="submitButton">
                Submit Problem
            </button>

        </form>

        <p class="message" id="message"></p>

    </div>

    <!-- Reported Problems -->

    <div class="card">

        <h2>All Reported Problems</h2>

        <p id="loadingMessage">Loading problems...</p>

        <div id="problemList"></div>

    </div>

</div>

<script type="module">

    // Firebase imports

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        updateDoc,
        doc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";


    // Firebase configuration

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // HTML elements

    const problemForm = document.getElementById("problemForm");

    const problemList = document.getElementById("problemList");

    const message = document.getElementById("message");

    const submitButton = document.getElementById("submitButton");


    // Store problems received from Firebase

    let problems = [];


    // Submit a new problem

    problemForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const reporterName =
            document.getElementById("reporterName").value.trim();

        const reporterContact =
            document.getElementById("reporterContact").value.trim();

        const category =
            document.getElementById("problemCategory").value;

        const description =
            document.getElementById("problemDescription").value.trim();

        const location =
            document.getElementById("problemLocation").value.trim();


        // Validate contact number

        if (!/^[6-9][0-9]{9}$/.test(reporterContact)) {

            message.textContent =
                "Please enter a valid 10-digit mobile number.";

            return;
        }


        try {

            submitButton.disabled = true;

            message.textContent = "Submitting your problem...";


            // Save problem to Firestore

            const docRef = await addDoc(
                collection(db, "problems"),
                {
                    reporterName: reporterName,
                    reporterContact: reporterContact,
                    category: category,
                    description: description,
                    location: location,

                    status: "Pending",

                    createdAt: serverTimestamp()
                }
            );


            message.textContent =
                "Problem submitted successfully! ID: " + docRef.id;

            problemForm.reset();

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to submit problem. Please try again.";

        } finally {

            submitButton.disabled = false;

        }

    });


    // Display problems

    function displayProblems() {

        problemList.innerHTML = "";


        // Calculate statistics

        const total = problems.length;

        const pending = problems.filter(
            problem => problem.status === "Pending"
        ).length;

        const progress = problems.filter(
            problem => problem.status === "In Progress"
        ).length;

        const resolved = problems.filter(
            problem => problem.status === "Resolved"
        ).length;


        document.getElementById("totalCount").textContent = total;

        document.getElementById("pendingCount").textContent = pending;

        document.getElementById("progressCount").textContent = progress;

        document.getElementById("resolvedCount").textContent = resolved;


        // Show message if no problems exist

        if (problems.length === 0) {

            problemList.innerHTML =
                '<p class="empty">No problems reported yet.</p>';

            return;
        }


        // Display each problem

        problems.forEach(function(problem) {

            const card = document.createElement("div");

            card.className = "problem";


            const title = document.createElement("h3");

            title.textContent =
                problem.category + " Problem";


            const status = document.createElement("span");

            status.className =
                "status " +
                (problem.status === "In Progress"
                    ? "InProgress"
                    : problem.status);

            status.textContent = problem.status;


            const id = document.createElement("p");

            id.textContent = "Problem ID: " + problem.id;


            const reporter = document.createElement("p");

            reporter.textContent =
                "Reporter: " + problem.reporterName;


            const contact = document.createElement("p");

            contact.textContent =
                "Contact: " + problem.reporterContact;


            const description = document.createElement("p");

            description.textContent =
                "Description: " + problem.description;


            const location = document.createElement("p");

            location.textContent =
                "Location: " + problem.location;


            const date = document.createElement("p");

            if (problem.createdAt) {

                date.textContent =
                    "Reported: " +
                    new Date(problem.createdAt.seconds * 1000)
                        .toLocaleString();

            } else {

                date.textContent = "Reported: Just now";

            }


            // Status update control

            const statusLabel = document.createElement("label");

            statusLabel.textContent = "Update Status: ";


            const statusSelect = document.createElement("select");

            ["Pending", "In Progress", "Resolved"].forEach(
                function(value) {

                    const option = document.createElement("option");

                    option.value = value;

                    option.textContent = value;

                    statusSelect.appendChild(option);

                }
            );

            statusSelect.value = problem.status;


            const updateButton = document.createElement("button");

            updateButton.textContent = "Update Status";


            updateButton.addEventListener("click", async function() {

                try {

                    updateButton.disabled = true;

                    await updateDoc(
                        doc(db, "problems", problem.id),
                        {
                            status: statusSelect.value
                        }
                    );

                } catch (error) {

                    console.error(error);

                    alert("Unable to update problem status.");

                } finally {

                    updateButton.disabled = false;

                }

            });


            // Add elements to card

            card.appendChild(title);

            card.appendChild(status);

            card.appendChild(id);

            card.appendChild(reporter);

            card.appendChild(contact);

            card.appendChild(description);

            card.appendChild(location);

            card.appendChild(date);

            card.appendChild(statusLabel);

            card.appendChild(statusSelect);

            card.appendChild(updateButton);


            problemList.appendChild(card);

        });

    }


    // Listen for Firestore changes

    onSnapshot(
        collection(db, "problems"),

        function(snapshot) {

            problems = snapshot.docs.map(function(document) {

                return {
                    id: document.id,
                    ...document.data()
                };

            });

            document.getElementById("loadingMessage").textContent = "";

            displayProblems();

        },

        function(error) {

            console.error(error);

            document.getElementById("loadingMessage").textContent =
                "Unable to load problems. Check your Firebase settings.";

        }
    );

</script>

</body>
</html>
