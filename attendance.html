<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VillageConnect - Attendance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #176b45;
            color: white;
            padding: 25px;
        }

        nav {
            background: #125637;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .count {
            font-size: 35px;
            font-weight: bold;
            color: #176b45;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        button {
            background: #176b45;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #125637;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #176b45;
            color: white;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .present {
            color: #15803d;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            table {
                font-size: 13px;
            }

            th, td {
                padding: 6px;
            }

            nav a {
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>VillageConnect</h1>
    <p>Daily Attendance Management</p>
</header>

<nav>
    <a href="attendance.html">Attendance</a>
    <a href="problems.html">Problems</a>
    <a href="index.html">Logout</a>
</nav>

<div class="container">

    <h2>Daily Worker Attendance</h2>

    <div class="card">
        <h2>Today's Attendance</h2>
        <p id="todayDate"></p>
        <p class="count" id="attendanceCount">0</p>
        <p>People Present Today</p>
    </div>

    <div class="card">
        <h2>Mark Your Attendance</h2>

        <form id="attendanceForm">
            <label>Full Name</label>
            <input type="text" id="workerName" required>

            <label>Role</label>
            <select id="workerRole" required>
                <option value="">Select Role</option>
                <option>Sanitation Worker</option>
                <option>Water Supply Worker</option>
                <option>Road Maintenance Worker</option>
                <option>Municipal Member</option>
                <option>Village Official</option>
                <option>Other</option>
            </select>

            <label>Contact Number</label>
            <input
                type="tel"
                id="workerContact"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <label>Today's Work Summary</label>
            <textarea id="workSummary" rows="4" required></textarea>

            <button type="submit" id="submitButton">Mark Present</button>
            <p class="message" id="formMessage" role="status"></p>
        </form>
    </div>

    <div class="card">
        <h2>Today's Attendance Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Contact</th>
                    <th>Work Summary</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="attendanceRecords"></tbody>
        </table>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        query,
        where,
        getDocs,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // Your Firebase project configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAN0_rn-dpXNFzBkKOj8eT0SboCZuEA6hU",
        authDomain: "villageconnect-f66a2.firebaseapp.com",
        projectId: "villageconnect-f66a2",
        storageBucket: "villageconnect-f66a2.firebasestorage.app",
        messagingSenderId: "326691335569",
        appId: "1:326691335569:web:66cf4e8dd8b67eff23be30",
        measurementId: "G-KY82ZB8EBR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const attendanceCollection = collection(db, "attendance");

    // Get today's date in local time
    function getToday() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    const today = getToday();

    document.getElementById("todayDate").textContent =
        new Date().toLocaleDateString();

    const attendanceForm = document.getElementById("attendanceForm");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");
    const attendanceRecords = document.getElementById("attendanceRecords");

    // Listen for shared attendance records for today.
    // When another user adds a record, this table updates automatically.
    const todayQuery = query(
        attendanceCollection,
        where("date", "==", today)
    );

    onSnapshot(todayQuery, function(snapshot) {
        attendanceRecords.innerHTML = "";

        const records = [];

        snapshot.forEach(function(documentSnapshot) {
            records.push(documentSnapshot.data());
        });

        // Sort by time, newest first
        records.sort(function(a, b) {
            return (b.createdAt || 0) - (a.createdAt || 0);
        });

        records.forEach(function(record) {
            const row = document.createElement("tr");

            [
                record.name,
                record.role,
                record.contact,
                record.workSummary,
                record.time
            ].forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value || "";
                row.appendChild(cell);
            });

            attendanceRecords.appendChild(row);
        });

        document.getElementById("attendanceCount").textContent =
            records.length;

    }, function(error) {
        console.error("Could not load attendance:", error);
        formMessage.textContent =
            "Could not load shared attendance. Check your Firebase Firestore setup.";
    });

    // Mark attendance in Firestore
    attendanceForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        submitButton.disabled = true;
        formMessage.textContent = "Saving attendance...";

        const contact = document.getElementById("workerContact").value.trim();

        try {
            // Check whether this contact has already marked attendance today
            const duplicateQuery = query(
                attendanceCollection,
                where("date", "==", today),
                where("contact", "==", contact)
            );

            const duplicateSnapshot = await getDocs(duplicateQuery);

            if (!duplicateSnapshot.empty) {
                formMessage.textContent =
                    "This person has already marked attendance today.";
                return;
            }

            const record = {
                name: document.getElementById("workerName").value.trim(),
                role: document.getElementById("workerRole").value,
                contact: contact,
                workSummary: document.getElementById("workSummary").value.trim(),
                date: today,
                time: new Date().toLocaleTimeString(),
                createdAt: Date.now()
            };

            await addDoc(attendanceCollection, record);

            attendanceForm.reset();
            formMessage.textContent = "Attendance marked successfully!";

        } catch (error) {
            console.error("Error saving attendance:", error);
            formMessage.textContent =
                "Could not save attendance. Check your internet connection and Firestore rules.";
        } finally {
            submitButton.disabled = false;
        }
    });
</script>

</body>
</html>
